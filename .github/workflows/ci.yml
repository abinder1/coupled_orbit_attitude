name: CI
on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        matlab: [R2024a, R2025a]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: ${{ matrix.matlab }}

      - name: Run buildtool (setup, check, test)
        run: |
          matlab -batch "try, cd('${{ github.workspace }}'); buildtool; catch ME, disp(getReport(ME,'extended')); exit(1); end"

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test_results/**
