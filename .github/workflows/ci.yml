name: CI
on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: matlab-actions/setup-matlab@v2
        with:
          release: latest
          # products: Symbolic_Math_Toolbox   # list any toolboxes you use

      - uses: matlab-actions/run-build@v2
        with:
          tasks: test
        # Private repo on GitHub-hosted runners: add a MATLAB batch licensing
        # token as a repository secret and uncomment:
        # env:
        #   MLM_LICENSE_TOKEN: ${{ secrets.MATLAB_BATCH_TOKEN }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: results/
