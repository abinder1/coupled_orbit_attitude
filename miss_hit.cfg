project_root

# MISS_HIT project configuration
# Keep this intentionally small and conservative.

line_length: 88
tab_width: 4

# MATLAB naming style used in this repo:
# - classes: PascalCase
# - functions, methods, parameters, attributes: lowerCamelCase
# - parameters, attributes: snake_case
regex_class_name: "[A-Z][A-Za-z0-9]*"
regex_function_name: "[a-z][A-Za-z0-9]*"
regex_script_name: "[a-z][A-Za-z0-9]*"
regex_method_name: "[a-z][A-Za-z0-9]*"
regex_attribute_name: "^[a-z0-9]+(_[a-z0-9]+)*$"
regex_parameter_name: "^[a-z0-9]+(_[a-z0-9]+)*$"
